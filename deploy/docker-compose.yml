# =============================================================================
# docker-compose.drone.yml
# Run on the drone (aarch64 / Ubuntu 18 host)
# Uses the SLIM runtime image — no compilers, no dev tools
# Pre-built install/ artifacts are mounted in via volume
# =============================================================================
version: "3.3"

services:
  voxl:
    image: voxl-drone:runtime-arm64                   # Pre-built slim image
    container_name: voxl-runtime
    hostname: voxl-runtime
    privileged: true
    network_mode: host
    ipc: host
    shm_size: '256mb'
    volumes:
      - ./ros2_ws:/ros2_ws                            # Modified ros2_ws containing only required files for runtime
      - /dev:/dev                                     # Serial ports, cameras, IMU, GPIO
      - /run/mpa:/run/mpa                             # Host modal-pipe endpoints for tflite data
      - /usr/include/modal_pipe.h:/usr/include/modal_pipe.h:ro
      - /usr/include/modal_pipe_client.h:/usr/include/modal_pipe_client.h:ro
      - /usr/include/modal_pipe_common.h:/usr/include/modal_pipe_common.h:ro
      - /usr/include/modal_pipe_interfaces.h:/usr/include/modal_pipe_interfaces.h:ro
      - /usr/include/modal_pipe_deprecated.h:/usr/include/modal_pipe_deprecated.h:ro
      - /usr/lib64:/opt/voxl-lib64                    # VOXL runtime libraries (read-write for symlink creation)
      - /opt/qcom/usr/lib/libgbm.so.gbm:/opt/voxl-lib64/libgbm.so.gbm:ro
      - ./cyclonedds.xml:/tmp/cyclonedds.xml
      - ./entrypoint.sh:/tmp/entrypoint.sh
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DISCOVERY_SERVER=127.0.0.1:11811
      - ROS_SUPER_CLIENT=TRUE
      - ROS_LOCALHOST_ONLY=0
      - LD_LIBRARY_PATH=/opt/voxl-lib64:/usr/lib/aarch64-linux-gnu:/usr/lib
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    entrypoint: ["/tmp/entrypoint.sh"]
